<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>나의 지출 내역</title>
  <link rel="stylesheet" href="styles.css">
  <script type="module" src="app.js"></script>
</head>
<body>
  <main>
    <header><div><p class="eyebrow">MY EXPENSE TRACKER · v1.0</p><h1>나의 지출 내역</h1><p>매일의 지출을 기록하고, 한 달의 흐름을 확인하세요.</p></div><div class="backup"><button id="export" type="button">JSON 백업</button><button id="import" type="button">JSON 복원</button><input id="backup-file" type="file" accept=".json,application/json" hidden></div></header>
    <p id="message" role="status" aria-live="polite"></p>
    <section class="overview" aria-labelledby="overview-title"><div class="section-heading"><h2 id="overview-title">이번 달 살펴보기</h2><label>조회 월 <input id="month" type="month" required></label></div><div id="summary" class="summary"></div></section>
    <div class="workspace"><section class="panel" aria-labelledby="form-title"><h2 id="form-title">지출 등록</h2><form id="expense-form"><label>날짜<input name="date" type="date" required></label><label>내용<input name="description" placeholder="예: 점심 식사" maxlength="100" required></label><label>금액 (원)<input name="amount" type="number" min="1" max="999999999999" step="1" placeholder="0" required></label><label>결제수단<select name="payment" required><option>신용카드</option><option>체크카드</option><option>현금</option><option>계좌이체</option><option>기타</option></select></label><div class="form-actions"><button class="primary" type="submit">등록하기</button><button id="cancel" type="button" hidden>수정 취소</button></div></form></section>
    <section class="panel history" aria-labelledby="history-title"><div class="section-heading"><h2 id="history-title">지출 내역</h2><span id="count"></span></div><div class="table-scroll"><table><caption class="sr-only">선택한 월의 지출 내역</caption><thead><tr><th scope="col">날짜</th><th scope="col">내용</th><th scope="col">결제수단</th><th scope="col">금액</th><th scope="col">관리</th></tr></thead><tbody id="expenses"></tbody></table></div><p id="empty">아직 기록된 지출이 없어요. 첫 지출을 등록해 보세요.</p></section></div>
    <footer>데이터는 이 브라우저에 저장됩니다. 브라우저 데이터를 지우기 전 JSON으로 백업하세요.</footer>
  </main>
</body>
</html>
